<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoreX</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, 'Segoe UI', system-ui, sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }

      body {
        background: transparent;
      }

      .shell {
        width: 100%;
        height: 100%;
        border-radius: 22px;
        overflow: hidden;
        position: relative;
        background: #050810;
        border: 1px solid rgba(154, 94, 255, 0.4);
        box-shadow:
          0 28px 90px rgba(0, 0, 0, 0.75),
          0 0 80px rgba(154, 94, 255, 0.15),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }

      .aurora {
        position: absolute;
        inset: -8%;
        opacity: 0.4;
        pointer-events: none;
      }

      .aurora-a {
        background: radial-gradient(circle at 30% 40%, rgba(154, 94, 255, 0.45), transparent 55%);
      }

      .aurora-b {
        background: radial-gradient(circle at 70% 60%, rgba(0, 210, 255, 0.35), transparent 50%);
      }

      .aurora-c {
        background: radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.18), transparent 45%);
      }

      .scanlines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 2px,
          transparent 4px
        );
        opacity: 0.25;
      }

      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.55) 100%);
      }

      .hero {
        position: absolute;
        left: 50%;
        top: 40%;
        width: 220px;
        height: 220px;
        transform: translate(-50%, -50%);
      }

      .hex-grid {
        position: absolute;
        inset: 0;
      }

      .hex {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
        background: linear-gradient(135deg, rgba(154, 94, 255, 0.35), rgba(0, 210, 255, 0.2));
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 20px rgba(0, 210, 255, 0.25);
      }

      .hex:nth-child(1) { transform: translate(-58px, -34px); opacity: 0.7; }
      .hex:nth-child(2) { transform: translate(58px, -34px); opacity: 0.7; }
      .hex:nth-child(3) { transform: translate(0, 62px); opacity: 0.7; }
      .hex:nth-child(4) { transform: translate(0, 0) scale(1.15); opacity: 0.9; }

      .core-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 72px;
        height: 72px;
        margin: -36px 0 0 -36px;
      }

      .core {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, #fff 0%, #00d2ff 22%, #9a5eff 65%, #312e81 100%);
        box-shadow:
          0 0 35px rgba(0, 210, 255, 0.65),
          0 0 70px rgba(154, 94, 255, 0.45),
          inset 0 -8px 18px rgba(0, 0, 0, 0.35);
        animation: coreBeat 1.8s ease-in-out infinite;
      }

      @keyframes coreBeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      .orbit-dot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: #00d2ff;
        box-shadow: 0 0 12px #00d2ff;
      }

      .orbit-dot.a { transform: translateX(88px); }
      .orbit-dot.b { transform: rotate(120deg) translateX(72px); background: #c49aff; box-shadow: 0 0 12px #9a5eff; }
      .orbit-dot.c { transform: rotate(240deg) translateX(96px); width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; }

      .brand {
        position: absolute;
        left: 0;
        right: 0;
        top: 66%;
        text-align: center;
        pointer-events: none;
      }

      .brand h1 {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        background: linear-gradient(120deg, #f5e6ff 0%, #00d2ff 45%, #9a5eff 80%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .brand p {
        margin-top: 8px;
        font-size: 11px;
        color: rgba(148, 163, 184, 0.9);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .phase-tag {
        display: inline-block;
        margin-top: 10px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(0, 210, 255, 0.95);
        border: 1px solid rgba(0, 210, 255, 0.35);
        background: rgba(0, 210, 255, 0.08);
      }

      .footer {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 22px;
      }

      .status {
        font-size: 11px;
        color: #94a3b8;
        margin-bottom: 10px;
        min-height: 16px;
        transition: color 0.3s ease;
      }

      .shell.error .status {
        color: #fca5a5;
      }

      .shell.error .fill {
        background: linear-gradient(90deg, #ef4444, #f97316) !important;
        animation: none !important;
      }

      .shell.error .brand h1 {
        animation: none;
        background: linear-gradient(135deg, #fecaca, #f87171);
        -webkit-background-clip: text;
        background-clip: text;
      }

      .track {
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
        box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.35);
      }

      .fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #9a5eff, #00d2ff, #ec4899, #9a5eff);
        background-size: 300% 100%;
        animation: shimmer 2s linear infinite;
        transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 0 16px rgba(0, 210, 255, 0.45);
      }

      @keyframes shimmer {
        0% { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }

      .shell.done .fill {
        animation: none;
        background: linear-gradient(90deg, #22c55e, #00d2ff);
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
      }

      .choice {
        display: none;
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 22px;
        z-index: 4;
        padding: 14px 14px 12px;
        border-radius: 14px;
        background: rgba(8, 12, 22, 0.92);
        border: 1px solid rgba(154, 94, 255, 0.35);
        -webkit-app-region: no-drag;
        pointer-events: auto;
      }

      .shell.choice-open .choice {
        display: block;
      }

      .shell.choice-open .status,
      .shell.choice-open .track {
        visibility: hidden;
      }

      .choice p {
        font-size: 12px;
        line-height: 1.45;
        color: #cbd5e1;
        margin-bottom: 12px;
      }

      .choice-actions {
        display: flex;
        gap: 8px;
      }

      .choice-actions button {
        flex: 1;
        height: 34px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        -webkit-app-region: no-drag;
      }

      .choice-continue {
        background: linear-gradient(180deg, #7c3aed, #6d28d9);
        color: #f8fafc;
      }

      .choice-continue:hover {
        filter: brightness(1.08);
      }

      .choice-close {
        background: rgba(15, 23, 42, 0.9);
        color: #e2e8f0;
        border-color: rgba(148, 163, 184, 0.35);
      }

      .choice-close:hover {
        background: rgba(30, 41, 59, 0.95);
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell">
      <div class="aurora aurora-a"></div>
      <div class="aurora aurora-b"></div>
      <div class="aurora aurora-c"></div>
      <div class="scanlines"></div>
      <div class="vignette"></div>

      <div class="hero">
        <div class="hex-grid">
          <div class="hex"></div>
          <div class="hex"></div>
          <div class="hex"></div>
          <div class="hex"></div>
        </div>
        <div class="core-wrap">
          <div class="core"></div>
        </div>
        <div class="orbit-dot a"></div>
        <div class="orbit-dot b"></div>
        <div class="orbit-dot c"></div>
      </div>

      <div class="brand">
        <h1>CoreX</h1>
        <p>Neural Forge</p>
        <div class="phase-tag" id="phase">boot</div>
      </div>

      <div class="choice" id="choice" role="dialog" aria-labelledby="choice-text">
        <p id="choice-text">Ollama не запущена. Можно открыть CoreX без локальной модели или закрыть приложение.</p>
        <div class="choice-actions">
          <button type="button" class="choice-continue" id="choice-continue">Продолжить без Ollama</button>
          <button type="button" class="choice-close" id="choice-close">Закрыть</button>
        </div>
      </div>

      <div class="footer">
        <div class="status" id="status">Запуск…</div>
        <div class="track"><div class="fill" id="fill"></div></div>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const fillEl = document.getElementById('fill');
      const shellEl = document.getElementById('shell');
      const phaseEl = document.getElementById('phase');
      let progress = 4;

      const phaseLabels = {
        boot: 'инициализация',
        backend: 'backend',
        ollama_server: 'ollama',
        model: 'модель',
        model_pending: 'модель',
        online_config: 'online api',
        ollama_skipped: 'без ollama',
        ui: 'интерфейс',
        ready: 'готово',
      };

      const choiceTextEl = document.getElementById('choice-text');
      let choiceOpen = false;

      function setChoiceOpen(open, message) {
        choiceOpen = Boolean(open);
        shellEl.classList.toggle('choice-open', choiceOpen);
        if (message && choiceTextEl) {
          choiceTextEl.textContent = message;
        }
      }

      function setProgress(value, message, options = {}) {
        progress = Math.max(progress, Math.min(100, Number(value) || 0));
        fillEl.style.width = progress + '%';
        if (message) statusEl.textContent = message;
        if (options.phase && phaseLabels[options.phase]) {
          phaseEl.textContent = phaseLabels[options.phase];
        }
        if (options.error) shellEl.classList.add('error');
        if (progress >= 100) shellEl.classList.add('done');
        if (options.choice === 'ollama_missing') {
          setChoiceOpen(true, message || choiceTextEl.textContent);
        } else if (options.choice === null || options.phase === 'ui' || options.phase === 'ollama_skipped') {
          setChoiceOpen(false);
        }
      }

      function sendChoice(action) {
        if (!choiceOpen) return;
        setChoiceOpen(false);
        if (window.splashAPI?.choose) {
          window.splashAPI.choose(action);
        }
      }

      document.getElementById('choice-continue').addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        sendChoice('continue');
      });
      document.getElementById('choice-close').addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        sendChoice('close');
      });

      setProgress(4, 'Инициализация CoreX…', { phase: 'boot' });

      if (window.splashAPI?.onUpdate) {
        window.splashAPI.onUpdate((payload) => {
          setProgress(payload?.progress ?? progress, payload?.message, {
            phase: payload?.phase,
            error: payload?.error,
            choice: payload?.choice,
          });
        });
      }
    </script>
  </body>
</html>
